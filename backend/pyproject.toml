[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-compass-backend"
version = "0.1.0"
description = "Бэкенд «Клинический компас» — FastAPI + PostgreSQL (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) в дефолтах аргументов — идиоматический паттерн FastAPI
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Миграции Alembic: long DDL-строки допустимы
"alembic/versions/*.py" = ["E501"]


# ---------------------------------------------------------------- Mypy
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "db: тесты, требующие PostgreSQL (пропускаются при SKIP_DB_TESTS=1 или недоступной БД)",
]
filterwarnings = ["ignore::DeprecationWarning"]
