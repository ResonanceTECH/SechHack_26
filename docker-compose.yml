# Clinical Compass — docker-compose
# Запуск: docker compose up -d (сначала создайте .env из .env.example)

services:
  # --- PostgreSQL (PostgreSQL 16) ---
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sechhack}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sechhack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Redis (rate-limit, в будущем очереди Celery) ---
  redis:
    image: redis:7-alpine
    container_name: cc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Backend (FastAPI / SQLAlchemy async) ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cc-backend
    ports:
      - "${PORT:-3001}:3001"
    environment:
      # App
      - APP_NAME=${APP_NAME:-clinical-compass-backend}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Server
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3001}
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sechhack}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Security / JWT
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # SMS (dev-заглушка)
      - SMS_CODE_TTL_SECONDS=${SMS_CODE_TTL_SECONDS:-300}
      - SMS_RESEND_SECONDS=${SMS_RESEND_SECONDS:-60}
      - SMS_MAX_ATTEMPTS=${SMS_MAX_ATTEMPTS:-3}
      - SMS_MAX_PER_HOUR=${SMS_MAX_PER_HOUR:-5}
      # Rate limit входа
      - LOGIN_RATE_LIMIT_ATTEMPTS=${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      - LOGIN_RATE_WINDOW_SECONDS=${LOGIN_RATE_WINDOW_SECONDS:-900}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,exp://localhost:8081,http://10.0.2.2:3001}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Только для локальной разработки: смонтируйте код, чтобы перезагружать без rebuild
    # volumes:
    #   - ./backend/app:/app/app

  # --- Frontend (React/Vite + nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
